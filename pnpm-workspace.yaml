packages:
  - 'apps/*'
  - 'services/*'
  - 'workers/*'
  - 'packages/*'
  - 'integrations/*'
  - 'platforms/*'

nodeVersion: 24.18.1
engineStrict: true
pmOnFail: error

# Supply-chain security baseline.
# Newly published dependency versions must age for 24 hours.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Explicit temporary exception created during TASK-001.
minimumReleaseAgeExclude:
  - 'globals@17.11.0'

# TASK-005 dependencies expose optional install scripts. They are not required by the
# Temporal workflow package, so keep them explicitly blocked instead of granting a
# repository-wide supply-chain exception.
allowBuilds:
  '@swc/core': false
  protobufjs: false
