openapi: 3.1.0
info:
  title: YASTROYKA AI MEDIA COMPANY Internal API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200": { description: OK }
  /v1/commerce/products/{productId}/content-pack:
    get:
      operationId: getProductContentPack
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
        - name: offerId
          in: query
          required: true
          description: Explicit seller offer; products and seller offers are never collapsed.
          schema: { type: string }
      responses:
        "200":
          description: Fresh Product Content Pack
          content:
            application/json:
              schema:
                $ref: ../commerce/product-content-pack.schema.json
        "409": { description: Price or stock snapshot must be refreshed }
        "422": { description: Content-pack construction blocked by a commerce invariant }
  /v1/model-exchange/route:
    post:
      operationId: routeModel
      responses:
        "200": { description: Routing decision }
