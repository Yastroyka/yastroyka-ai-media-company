name: CI

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: yastroyka_r1_test
          POSTGRES_USER: yastroyka_r1_app
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm run quality:check

      - name: Typecheck authorization package
        run: pnpm --filter @yastroyka/auth run typecheck

      - name: Run authorization tests
        run: pnpm --filter @yastroyka/auth run test

      - name: Typecheck orchestrator service
        run: pnpm --filter @yastroyka/orchestrator run typecheck

      - name: Run orchestrator tests
        run: pnpm --filter @yastroyka/orchestrator run test

      - name: Typecheck Temporal workflows
        run: pnpm --filter @yastroyka/temporal-workflows run typecheck

      - name: Run Temporal workflow tests
        run: pnpm --filter @yastroyka/temporal-workflows run test

      - name: Typecheck commerce SDK
        run: pnpm --filter @yastroyka/commerce-sdk run typecheck

      - name: Run commerce SDK tests
        run: pnpm --filter @yastroyka/commerce-sdk run test

      - name: Typecheck Commerce Content Bridge
        run: pnpm --filter @yastroyka/commerce-bridge run typecheck

      - name: Run Commerce Content Bridge tests
        run: pnpm --filter @yastroyka/commerce-bridge run test

      - name: Typecheck database package
        run: pnpm --filter @yastroyka/db run typecheck

      - name: Run database integration tests
        run: pnpm --filter @yastroyka/db run test:integration
        env:
          YASTROYKA_DB_HOST: localhost
          YASTROYKA_DB_PORT: '5432'
          YASTROYKA_DB_NAME: yastroyka_r1_test
          YASTROYKA_DB_USER: yastroyka_r1_app
          YASTROYKA_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
