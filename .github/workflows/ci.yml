name: CI

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: yastroyka_r1_test
          POSTGRES_USER: yastroyka_r1_app
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TASK-025 Prettier output probe
        run: |
          echo '--- TASK-025 PRETTIER BEGIN ---'
          pnpm exec prettier scripts/owner-ready-bridge.test.mjs
          echo '--- TASK-025 PRETTIER END ---'

      - name: Run R1 Golden Evals Release Gate
        run: pnpm run release:gate:r1
        env:
          YASTROYKA_RELEASE_GATE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          YASTROYKA_DB_HOST: localhost
          YASTROYKA_DB_PORT: '5432'
          YASTROYKA_DB_NAME: yastroyka_r1_test
          YASTROYKA_DB_USER: yastroyka_r1_app
          YASTROYKA_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
