name: TASK-009 format probe

on:
  push:
    branches:
      - task-009/platform-workspaces

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier --write packages/db/src/postgres-platform-workspace-store.ts packages/db/tests/task-009.integration.test.ts
          git diff -- packages/db/src/postgres-platform-workspace-store.ts packages/db/tests/task-009.integration.test.ts
