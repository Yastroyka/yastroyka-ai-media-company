name: Owner Ready Bridge

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: owner-ready-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  owner-ready-transition:
    name: Owner Ready transition
    if: >-
      ${{ github.event.issue.pull_request != null &&
          github.actor == github.repository_owner &&
          startsWith(github.event.comment.body, '/owner-ready ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: false

      - name: Execute owner Ready bridge
        run: node scripts/owner-ready-bridge.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
